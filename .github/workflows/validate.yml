# PR gate for leaderboard submissions.
#
# Every pull request that touches `submissions/**` is validated here. The job
# diffs the PR against its base to find which submission bundles changed, then
# runs `gptnt submission validate` on each. A bundle is one flat folder,
# `submissions/YYYYMMDD_<display-slug>_<capfp8>_<suite>_<ver>/`, holding a
# `submission.yaml` manifest plus its payload (`experiments.parquet` for
# interactive runs, or `metrics.json` for statics). A PR may add more than one.
#
# Each manifest selects its GPTNT release. The helper requires that release to
# be published, verifies its tar asset and embedded Git identity, then runs the
# validator installed from that asset.

name: validate

on:
  pull_request:
    paths:
      - "submissions/**"
      - "scripts/validate_published_release.py"
      - "tests/test_validate_published_release.py"
      - "mise.toml"
      - ".github/workflows/validate.yml"

concurrency:
  group: validate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
          fetch-depth: 0 # full history needed for diff

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          enable-cache: true
          python-version: "3.13"

      - name: Test published-release validation
        run: uv run --with pyyaml==6.0.2 python -m unittest discover -s tests

      - name: Detect changed submission bundles
        id: detect
        run: |
          set -euo pipefail
          base="origin/${{ github.base_ref }}"
          bundles=""
          while IFS= read -r path; do
            [ -n "$path" ] || continue
            # Skip deletions: only validate bundles that still exist.
            [ -e "$path" ] || continue
            # Walk up to the nearest ancestor holding a submission.yaml.
            dir="$path"
            [ -d "$dir" ] || dir="$(dirname "$dir")"
            while [ "$dir" != "." ] && [ "$dir" != "/" ]; do
              if [ -f "$dir/submission.yaml" ]; then
                bundles="$bundles$dir"$'\n'
                break
              fi
              dir="$(dirname "$dir")"
            done
          done < <(git diff --name-only "$base"...HEAD -- 'submissions/**')

          # Dedupe into a stable set, one bundle dir per line.
          bundles="$(printf '%s' "$bundles" | sort -u | sed '/^$/d')"
          if [ -z "$bundles" ]; then
            echo "No submission bundles changed; nothing to validate."
          else
            echo "Changed bundles:"
            printf '%s\n' "$bundles"
          fi
          {
            echo "bundles<<EOF"
            printf '%s\n' "$bundles"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Validate submissions
        if: steps.detect.outputs.bundles != ''
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          status=0
          while IFS= read -r dir; do
            [ -n "$dir" ] || continue
            echo "::group::validate $dir"
            if ! uv run --with pyyaml==6.0.2 \
              python scripts/validate_published_release.py "$dir"; then
              status=1
            fi
            echo "::endgroup::"
          done <<< "${{ steps.detect.outputs.bundles }}"
          exit "$status"
