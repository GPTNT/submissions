[tools]
python = "3.13"

[tasks.validate]
description = "Validate a submission bundle locally, as CI does."
usage = '''
arg "<dir>" help="Path to the submission bundle directory"
'''
run = '''uv run --with pyyaml==6.0.2 python scripts/validate_published_release.py "{{arg(name="dir")}}"'''

[tasks.tests]
description = "Test the published-release validator."
run = "uv run --with pyyaml==6.0.2 python -m unittest discover -s tests"

[tasks.format]
description = "Format and check the repository Python."
run = [
  "uvx --from ruff==0.15.18 ruff format scripts tests",
  "uvx --from ruff==0.15.18 ruff check scripts tests",
]
